<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rulison Tax Consulting</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div id="app">Loading&hellip;</div>
<script src="assets/common.js"></script>
<script>
Promise.all([
fetchJSON('content/hero.json'),
fetchJSON('content/timeline.json')
]).then(function(results){
render(results[0], results[1]);
}).catch(function(err){
document.getElementById('app').textContent = 'Failed to load content: ' + err.message;
});

function render(h, t){
var badges = (h.badges||[]).map(function(b){return '<div class="cred-badge">'+esc(b)+'</div>';}).join('');
var hero = '<section class="hero" id="home">'
+'<div class="hero-brand" id="heroBrand">Rulison <span>Tax Consulting</span></div>'
+'<div class="hero-alliance">A Castro Business Services Strategic Alliance</div>'
+'<h1 class="hero-title">Straightforward tax help for <em>families</em>, <em>small businesses</em> &amp; <em>rental property</em> owners</h1>'
  +'<p class="hero-joke">We read the fine print so you don&rsquo;t have to.</p>'
+'<div class="cta-row"><a href="contact.html" class="btn-primary">Schedule a Consultation</a><a href="services.html" class="btn-secondary">Explore Services</a></div>'
+'<div class="badge-row">'+badges+'</div>'
+'</section>';

var timelineHero = '<div class="home-head"><div class="section-eyebrow">Never Miss a Deadline</div><h2 class="section-title">Tax Deadline Timeline</h2><p class="section-sub">Drag or click through the year to see key dates for filing, planning, and compliance.</p></div>';
var timelineBody = '<section class="timeline-section" id="timeline"><div class="timeline-outer" id="tOuter"><div class="timeline-track" id="tTrack"></div></div></section>';

var quick = '<section class="section-wrap quick-section" id="quicklinks">'
+'<div class="section-head"><div class="section-eyebrow">Find What You Need</div><h2 class="section-title">Explore</h2></div>'
+'<div class="quick-links-grid">'
+linkCard('about.html','About Us','Learn who we are and what drives our approach.')
+linkCard('services.html','Services','See the full range of tax help we provide.')
+linkCard('team.html','Our Team','Meet the professionals behind the work.')
+linkCard('contact.html','Contact','Reach out to schedule a consultation.')
+'</div></section>';

document.getElementById('app').innerHTML = headerHtml('home') + hero + timelineHero + timelineBody + quick + footerHtml();
initHeaderInteractions();
initBrandTrace();
buildTimeline(t);
}

function initBrandTrace(){
var el = document.getElementById('heroBrand');
if(!el || !window.SVGElement || !document.createElement('canvas').getContext) return;
var NS = 'http://www.w3.org/2000/svg', FAMILY = "'Times New Roman', Tinos, Times, serif";
var LS = 6, PAD = 12, S = 100, BIG = 122, WEIGHT = 400;
var mq = window.matchMedia('(max-width:860px)');
var WORD1 = [['R', BIG], ['ULISON', S]];
var WORD2 = [['T', BIG], ['AX ', S], ['C', BIG], ['ONSULTING', S]];
function build(){
var c = document.createElement('canvas').getContext('2d');
function measure(parts){
var w = 0, asc = 0, desc = 0, chars = 0;
parts.forEach(function(p){
c.font = WEIGHT + ' ' + p[1] + 'px ' + FAMILY;
var m = c.measureText(p[0]);
w += m.width; chars += p[0].length;
asc = Math.max(asc, m.actualBoundingBoxAscent || p[1]*0.66);
desc = Math.max(desc, m.actualBoundingBoxDescent || 2);
});
return { w: w + LS*(chars - 1), asc: asc, desc: desc };
}
var m1 = measure(WORD1), m2 = measure(WORD2);
var asc = Math.max(m1.asc, m2.asc), desc = Math.max(m1.desc, m2.desc);
var two = mq.matches, gap = 40, lineGap = 22, W, H, x1, y1, x2, y2;
if(!two){ W = m1.w + gap + m2.w; H = asc + desc; x1 = 0; x2 = m1.w + gap; y1 = y2 = asc; }
else { W = Math.max(m1.w, m2.w); H = 2*(asc + desc) + lineGap; x1 = (W - m1.w)/2; x2 = (W - m2.w)/2; y1 = asc; y2 = 2*asc + desc + lineGap; }
var svg = document.createElementNS(NS, 'svg');
svg.setAttribute('class', 'brand-svg');
svg.setAttribute('role', 'img');
svg.setAttribute('aria-label', 'Rulison Tax Consulting');
svg.setAttribute('viewBox', (-PAD) + ' ' + (-PAD) + ' ' + (W + 2*PAD) + ' ' + (H + 2*PAD));
svg.style.width = ((W + 2*PAD)/100) + 'em';
svg.innerHTML = '<defs><linearGradient id="brandGrad" gradientUnits="userSpaceOnUse" x1="' + x1 + '" y1="' + (y1 - asc) + '" x2="' + (x1 + m1.w) + '" y2="' + y1 + '"><stop offset="0" stop-color="#ffdc73"/><stop offset="0.5" stop-color="#f5b82e"/><stop offset="1" stop-color="#d98a10"/></linearGradient></defs>';
function word(cls, parts, x, y, paint){
var n = document.createElementNS(NS, 'text');
n.setAttribute('class', cls); n.setAttribute('x', x); n.setAttribute('y', y);
if(paint){ n.setAttribute('fill', paint); n.setAttribute('stroke', paint); }
parts.forEach(function(p){
var t = document.createElementNS(NS, 'tspan');
t.setAttribute('font-size', p[1]);
t.textContent = p[0];
n.appendChild(t);
});
svg.appendChild(n);
}
word('brand-word brand-trace', WORD1, x1, y1);
word('brand-word brand-trace', WORD2, x2, y2);
word('brand-word brand-fill', WORD1, x1, y1, 'url(#brandGrad)');
word('brand-word brand-fill', WORD2, x2, y2, '#ffffff');
el.textContent = '';
el.classList.add('has-svg');
el.appendChild(svg);
}
var ready = (document.fonts && document.fonts.load) ? Promise.all([document.fonts.load(WEIGHT + ' 100px Tinos'), document.fonts.ready]).catch(function(){}) : Promise.resolve();
ready.then(function(){
try { build(); } catch(e){}
var onChange = function(){ try { build(); } catch(e){} };
if(mq.addEventListener) mq.addEventListener('change', onChange); else if(mq.addListener) mq.addListener(onChange);
});
}

function linkCard(href, title, desc){
return '<a class="quick-link-card" href="'+href+'"><h3>'+title+'</h3><p>'+desc+'</p></a>';
}

function buildTimeline(t){
var track = document.getElementById('tTrack');
if(!track || !t || !t.months) return;
var monthIndex = new Date().getMonth();
var monthsHtml = '';
t.months.forEach(function(m, idx){
var isCurrent = idx === monthIndex;
var events = (m.events||[]).map(function(ev){
return '<div class="event-card"><div class="event-date">'+esc(ev.date)+'</div><div class="event-desc">'+esc(ev.desc)+'</div></div>';
}).join('');
monthsHtml += '<div class="month-col" data-index="'+idx+'"><div class="month-badge'+(isCurrent?' current':'')+'">'+esc(m.month)+'</div>'+events+'</div>';
});
track.innerHTML = monthsHtml;
var outer = document.getElementById('tOuter');
var cols = track.querySelectorAll('.month-col');
function scrollToIndex(i){
var col = cols[i];
if(col){ outer.scrollTo({left: col.offsetLeft - (outer.clientWidth/2) + (col.offsetWidth/2), behavior:'smooth'}); }
}
cols.forEach(function(col, i){
col.addEventListener('click', function(){ scrollToIndex(i); });
});
setTimeout(function(){ scrollToIndex(monthIndex); }, 50);
var isDown = false, startX, scrollLeft;
outer.addEventListener('mousedown', function(e){
isDown = true;
outer.classList.add('dragging');
startX = e.pageX - outer.offsetLeft;
scrollLeft = outer.scrollLeft;
});
outer.addEventListener('mouseleave', function(){ isDown = false; outer.classList.remove('dragging'); });
outer.addEventListener('mouseup', function(){ isDown = false; outer.classList.remove('dragging'); });
outer.addEventListener('mousemove', function(e){
if(!isDown) return;
e.preventDefault();
var x = e.pageX - outer.offsetLeft;
var walk = (x - startX) * 1.5;
outer.scrollLeft = scrollLeft - walk;
});
}
</script>
</body>
</html>

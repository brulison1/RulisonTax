<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Our Team - Rulison Tax Consulting</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div id="app">Loading&hellip;</div>
<script src="assets/common.js"></script>
<script>
fetchJSON('content/team.json').then(function(t){
render(t);
}).catch(function(err){
document.getElementById('app').textContent = 'Failed to load content: ' + err.message;
});

function render(t){
var pageHero = '<div class="page-hero"><div class="section-eyebrow">Meet the Team</div><h1 class="section-title">Your Tax Professionals</h1></div>';
var cards = (t.members||[]).map(function(m){
return '<div class="team-card"><div class="team-photo">(headshot here)</div><div class="team-name">'+esc(m.name)+'</div><div class="team-title">'+esc(m.title)+'</div><div class="team-bio">'+esc(m.bio)+'</div><div class="team-cred">'+esc(m.credential)+'</div></div>';
}).join('');
var body = '<section class="team-section section-wrap" style="padding-top:0;"><div class="team-grid">'+cards+'</div></section>';
document.getElementById('app').innerHTML = headerHtml('team') + pageHero + body + footerHtml();
initHeaderInteractions();
}
</script>
</body>
</html>

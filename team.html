<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Our Team - Rulison Tax Consulting</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div id="app">Loading&hellip;</div>
<script src="assets/common.js"></script>
<script>
fetchJSON('content/team.json').then(function(t){
render(t);
}).catch(function(err){
document.getElementById('app').textContent = 'Failed to load content: ' + err.message;
});

function attr(s){return esc(s).replace(/"/g,'&quot;');}

function contactLine(label, value, scheme){
var v = String(value==null?'':value).trim();
if(!v) return '';
var isPlaceholder = v.charAt(0)==='(';
var href = scheme==='tel:' ? 'tel:'+v.replace(/[^0-9+]/g,'') : scheme+v;
var shown = isPlaceholder ? esc(v) : '<a href="'+attr(href)+'">'+esc(v)+'</a>';
return '<div><span class="team-contact-label">'+label+'</span>'+shown+'</div>';
}

function render(t){
var pageHero = '<div class="page-hero"><div class="section-eyebrow">Meet the Team</div><h1 class="section-title">Your Tax Professionals</h1></div>';
var rows = (t.members||[]).map(function(m){
var photo = m.photo ? '<img src="'+attr(m.photo)+'" alt="'+attr(m.name)+'">' : '<div class="team-photo-empty">(photo coming soon)</div>';
var contact = contactLine('Email', m.email, 'mailto:') + contactLine('Phone', m.phone, 'tel:');
var title = String(m.title||'').split('|').map(function(x){return x.trim();}).filter(Boolean).map(esc).join('<span class="team-title-sep">&middot;</span>');
var bio = String(m.bio||'').split(/\n\s*\n/).map(function(x){return x.trim();}).filter(Boolean).map(function(x){return '<p>'+esc(x)+'</p>';}).join('');
var cred = String(m.credential||'').trim();
return '<article class="team-row"><div class="team-row-photo">'+photo+'</div><div class="team-row-info"><div class="team-name">'+esc(m.name)+'</div>'+(title?'<div class="team-title">'+title+'</div>':'')+(bio?'<div class="team-bio">'+bio+'</div>':'')+(cred?'<div class="team-cred">'+esc(cred)+'</div>':'')+(contact?'<div class="team-contact">'+contact+'</div>':'')+'</div></article>';
}).join('');
var body = '<section class="team-section section-wrap" style="padding-top:0;"><div class="team-list">'+rows+'</div></section>';
document.getElementById('app').innerHTML = headerHtml('team') + pageHero + body + footerHtml();
initHeaderInteractions();
}
</script>
</body>
</html>
